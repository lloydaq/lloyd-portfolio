<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusSignal: a multi-college campus platform · Case study · Lloyd D'Souza</title>
    <meta
      name="description"
      content="How CampusSignal works: a FastAPI and PostgreSQL platform where notices, a moderated community, academic records and issue reporting are shared by many colleges, each isolated on every request."

    <meta property="og:site_name" content="Lloyd D'Souza" />
    <meta property="og:title" content="CampusSignal: a multi-college campus platform · Case study" />
    <meta
      property="og:description"
      content="Many colleges on one platform without any of them seeing another&#39;s data: the college comes from the session, other colleges answer 404, and a tenant-isolation suite checks every route."
    />
    <!--seo:absolute-->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2eee6');
      })();
    </script>
  </head>
